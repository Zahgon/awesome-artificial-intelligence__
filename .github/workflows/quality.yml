name: Quality

on:
  pull_request:
    paths:
      - README.md
      - AUTOMATION.md
      - CONTRIBUTING.md
      - CURATION.md
      - "src/**"
      - "tests/**"
      - Cargo.toml
      - Cargo.lock
      - ".github/codex/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/workflows/**"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run unit tests
        run: cargo test
      - name: Validate README structure
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cargo build --release
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF"
            ./target/release/validate_readme README.md --check-links --base "origin/$BASE_REF"
          else
            ./target/release/validate_readme README.md --check-links
          fi
